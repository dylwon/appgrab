name: Refresh job board

on:
  schedule:
    - cron: "0 13 * * *"  # daily, about 6 AM Pacific: refresh the saved searches
  workflow_dispatch:      # "Run workflow" button: refresh the saved searches, or run a one-off search
    inputs:
      keywords:
        description: "Optional one-off search instead of a refresh, e.g. physical design, place and route (comma-separated)"
        required: false
        default: ""
      anywhere:
        description: "For the one-off search: also match the keywords in job descriptions (slower)"
        type: boolean
        default: false
  issues:
    types: [opened]       # anyone can request a search by opening an issue titled "Search: ..."
  push:
    branches: [main]      # rebuilds the page from stored results; new saved searches run right away

jobs:
  build:
    # Other issues (questions, bug reports) don't start a run.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Search:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:  # one run at a time; a queued run picks up every open search request
      group: appgrab
      cancel-in-progress: false
    permissions:
      contents: write  # stores results and history on the appgrab-state branch
      issues: write    # replies to and closes search requests
    steps:
      - uses: actions/checkout@v7

      - name: Restore stored results
        run: |
          mkdir -p state
          if git fetch --depth=1 origin appgrab-state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
          else
            echo "No stored results yet."
          fi

      - name: Search and build the page
        env:  # passed as variables, never pasted into a script, so typed text can't run as code
          GITHUB_TOKEN: ${{ github.token }}
          KEYWORDS: ${{ inputs.keywords }}
          ANYWHERE: ${{ inputs.anywhere }}
        run: python3 cloud.py

      # Kept on its own single-commit branch so main stays clean. Pushing it on every run also counts
      # as repository activity, which stops GitHub from pausing the schedule after 60 quiet days.
      - name: Store results and history
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b appgrab-state
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update stored results"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" appgrab-state

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
